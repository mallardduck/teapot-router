version: "2" # Required for V2 schema

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - revive
    - gosec
    - bodyclose
    - nilnil
    - usetesting # New in V2: recommends testing-specific packages
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - gosec
        text: "G705"

  settings:
    # Linter-specific configurations are now nested here
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          arguments: [ "checkPrivateReceivers" ]

# NEW in V2: Dedicated section for code formatters
formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - alias # Alias section: contains all alias imports. This section is not present unless explicitly enabled.
        - prefix(github.com/mallardduck)
        - prefix(github.com/mallardduck/teapot-router)
        - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled
    gofumpt:
      module-path: github.com/mallardduck/teapot-router
      extra:
        # Groups function parameters with repeated types.
        group-params: true
        # Clothes naked returns in functions with named results.
        clothe-returns: true
        # Multi-line function calls with the opening parenthesis at the end of a line should place the closing parenthesis at the start of a line.
        balance-calls: true
